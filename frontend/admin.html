<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 · 一本日记</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fff9f2" id="meta-theme-color">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📔</text></svg>">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('riben-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin">
  <div class="page">
    <header class="site-header">
      <a class="logo" href="index.html">一本日记<span class="dot"> ●</span></a>
      <nav class="site-nav" aria-label="主导航">
        <a class="nav-pill" href="index.html">首页</a>
        <a class="nav-pill" href="archive.html">手账集</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换到暗色模式" aria-pressed="false">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.3 4.3l1.7 1.7M18 18l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.3 19.7 6 18M18 6l1.7-1.7"/>
          </svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7 7 0 1 0 10.7 10.7Z"/>
          </svg>
        </button>
      </nav>
    </header>

    <main>
      <!-- 登录 -->
      <section class="admin-login" id="admin-login">
        <span class="sticker s1">管理员入口</span>
        <h1>🔐 翻开管理页</h1>
        <form id="login-form">
          <label class="c-field">
            <span>用户名</span>
            <input id="lf-username" autocomplete="username" required>
          </label>
          <label class="c-field">
            <span>密码</span>
            <input id="lf-password" type="password" autocomplete="current-password" required>
          </label>
          <p class="c-tip" id="login-tip" hidden></p>
          <button class="btn-more c-submit" type="submit">📖 打开手账</button>
        </form>
      </section>

      <!-- 后台主体（登录后显示，JS 渲染） -->
      <section id="admin-main" hidden>
        <div class="admin-bar">
          <span class="who">✍️ <span id="admin-who"></span> 的手账管理台</span>
          <nav class="admin-tabs" aria-label="后台导航">
            <button class="admin-tab is-active" data-tab="posts" type="button">文章</button>
            <button class="admin-tab" data-tab="comments" type="button">评论<span class="admin-badge" id="pending-badge" hidden></span></button>
            <button class="admin-tab" data-tab="tags" type="button">标签</button>
          </nav>
          <button class="admin-logout" id="admin-logout" type="button">退出登录 →</button>
        </div>

        <div class="admin-panel" id="panel-posts">
          <div class="admin-actions">
            <button class="ai-btn primary" id="btn-new-post" type="button">＋ 写新的一篇</button>
          </div>
          <div id="post-editor-wrap" hidden></div>
          <ul class="admin-list" id="admin-posts"></ul>
        </div>

        <div class="admin-panel" id="panel-comments" hidden>
          <div class="c-filter" id="comment-filter">
            <button class="ai-btn" data-status="0" type="button">待审核</button>
            <button class="ai-btn" data-status="1" type="button">已通过</button>
            <button class="ai-btn" data-status="2" type="button">已拒绝</button>
            <button class="ai-btn" data-status="" type="button">全部</button>
          </div>
          <ul class="admin-list" id="admin-comments"></ul>
        </div>

        <div class="admin-panel" id="panel-tags" hidden>
          <form class="tag-inline" id="tag-form">
            <label class="c-field">
              <span>标签名</span>
              <input id="tf-name" maxlength="64" required>
            </label>
            <label class="c-field">
              <span>颜色</span>
              <select id="tf-color">
                <option value="t-pink">粉（日常）</option>
                <option value="t-mint">绿（改造）</option>
                <option value="t-blue">蓝（食物/风景）</option>
                <option value="t-yellow">黄（淘货）</option>
              </select>
            </label>
            <button class="ai-btn primary" type="submit">＋ 新标签</button>
          </form>
          <p class="c-tip" id="tag-tip" hidden></p>
          <ul class="admin-list" id="admin-tags" style="margin-top:16px"></ul>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>♡ 2026 一本日记</span>
      <span class="footer-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span>riben.icu · 每天贴一页</span>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script src="js/render.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
