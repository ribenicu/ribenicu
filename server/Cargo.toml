[package]
name = "riben-server"
description = "一本日记 (riben.icu) backend: axum + MySQL + Redis"
version = "0.7.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono", "macros"] }
redis = { version = "0.27", features = ["tokio-comp"] }
comrak = "0.35"
ammonia = "4"
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.20", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
async-trait = "0.1"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }
rand = "0.8"
# MCP（Model Context Protocol）服务端：Streamable HTTP 传输
rmcp = { version = "3.9", features = ["transport-streamable-http-server"] }
schemars = "1"
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
# 部署流水线优先编译速度：codegen-units=1 + LTO 会让 release 编译慢 1 倍以上，
# 对一个日记后端来说运行时收益可以忽略。
lto = "thin"
codegen-units = 16
incremental = true
